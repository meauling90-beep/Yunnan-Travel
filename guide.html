<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>出行锦囊</title>
  <link rel="stylesheet" href="global.css">
  <style>.tip-block{padding:10px 0;border-bottom:1px solid #eee;}.tip-title{font-weight:600;}.tip-desc{font-size:14px;color:#666;margin-top:4px;}</style>
</head>
<body>
  <div class="app-container">
    <header class="top-header">
      <h2>📦 出行锦囊</h2>
    </header>
    <main class="page-content" id="main-content">
      <div id="guide-info">加载中...</div>
      <div id="tips-list"></div>
    </main>
    <nav class="bottom-nav">
      <a href="index.html" class="nav-item">今日</a>
      <a href="itinerary.html" class="nav-item">行程</a>
      <a href="favorites.html" class="nav-item">种草</a>
      <a href="language.html" class="nav-item">语言</a>
      <a href="guide.html" class="nav-item active">锦囊</a>
    </nav>
  </div>
  <script type="module">
    import { loadAllData } from './js/supabase-client.js';
    const allData = await loadAllData();
    if (!allData) {
      document.getElementById('guide-info').innerHTML = '<p>加载失败</p>';
    } else {
      document.getElementById('guide-info').innerHTML = `
        <div class="card">
          <h3>证件与票务</h3>
          <p>${allData.guide.info?.docs_note || '待补充'}</p>
        </div>
      `;
      document.getElementById('tips-list').innerHTML = allData.guide.tips.map(t => `
        <div class="card">
          <div class="tip-title">${t.title}</div>
          <div class="tip-desc">${t.content}</div>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
