<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>语言助手</title>
  <link rel="stylesheet" href="global.css">
  <style>.phrase-block{padding:12px 0;border-bottom:1px solid #eee;}.zh{font-weight:600;}.en{color:#666;margin-top:4px;font-size:14px;}</style>
</head>
<body>
  <div class="app-container">
    <header class="top-header">
      <h2>💬 语言助手</h2>
    </header>
    <main class="page-content" id="main-content">
      <div id="phrases-list">加载中...</div>
    </main>
    <nav class="bottom-nav">
      <a href="index.html" class="nav-item">今日</a>
      <a href="itinerary.html" class="nav-item">行程</a>
      <a href="favorites.html" class="nav-item">种草</a>
      <a href="language.html" class="nav-item active">语言</a>
      <a href="guide.html" class="nav-item">锦囊</a>
    </nav>
  </div>
  <script type="module">
    import { loadAllData } from './js/supabase-client.js';
    const allData = await loadAllData();
    const container = document.getElementById('phrases-list');
    if (!allData) { container.innerHTML = '<p>加载失败</p>'; }
    else {
      container.innerHTML = allData.phrases.map(p => `
        <div class="card">
          <div class="phrase-block">
            <div class="zh">${p.zh}</div>
            <div class="en">${p.en}</div>
          </div>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
