<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>完整行程 · 昆大丽香</title>
  <link rel="stylesheet" href="global.css">
</head>
<body>
  <div class="app-container">
    <header class="top-header">
      <h2>📅 完整行程</h2>
    </header>
    <main class="page-content" id="main-content">
      <div id="days-list">加载中...</div>
    </main>
    <nav class="bottom-nav">
      <a href="index.html" class="nav-item">今日</a>
      <a href="itinerary.html" class="nav-item active">行程</a>
      <a href="favorites.html" class="nav-item">种草</a>
      <a href="language.html" class="nav-item">语言</a>
      <a href="guide.html" class="nav-item">锦囊</a>
    </nav>
  </div>
  <script type="module">
    import { loadAllData } from './js/supabase-client.js';
    const allData = await loadAllData();
    const container = document.getElementById('days-list');
    if (!allData) {
      container.innerHTML = '<p>数据加载失败，请稍后重试</p>';
    } else {
      container.innerHTML = allData.days.map(day => `
        <div class="card">
          <h3>Day ${day.day_no} · ${day.date_str || ''}</h3>
          <p style="color:var(--indigo);font-weight:500;margin-bottom:10px;">${day.theme || ''}</p>
          ${day.items.map(item => `
            <div class="item-block">
              <div class="item-time">${item.time_slot || ''}</div>
              <div class="item-name">${item.name}</div>
              <div class="item-desc">${item.description || ''}</div>
            </div>
          `).join('')}
        </div>
      `).join('');
    }
  </script>
</body>
</html>
